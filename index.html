<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Небесный разведчик</title>
<style>
  :root { color-scheme: dark; --bg:#07090f; --fg:#e8eaf2; --dim:#8a90a6; --accent:#c9d4ff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; }
  .card { max-width:32rem; }
  h1 { font-size:1.6rem; margin:0 0 .6rem; letter-spacing:.01em; }
  p { color:var(--dim); margin:.4rem 0; }
  ul { text-align:left; color:var(--dim); margin:1.2rem auto 0; max-width:26rem; padding-left:1.1rem; }
  li { margin:.35rem 0; }
  .dot { color:var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>Небесный разведчик</h1>
    <p>Приложение в разработке.</p>
    <ul>
      <li><span class="dot">•</span> вердикт на сегодня: стоит ли выходить</li>
      <li><span class="dot">•</span> куда отъехать за тёмным небом</li>
      <li><span class="dot">•</span> режим съёмки: выдержка, таймлапс, пролёты МКС</li>
      <li><span class="dot">•</span> наведи телефон на небо — подписи объектов поверх камеры</li>
    </ul>
  </div>
</body>
</html>
